baseURL = "https://tax.informationhot.kr/"
languageCode = "ko"
title = "부동산 세금 가이드"
theme = "blowfish"
enableRobotsTXT = true
[pagination]
  pagerSize = 20

[params]
  colorScheme = "fire"
  description = "양도세 취득세 상속세 계산법과 절세 전략"
  mainSections = ["posts"]
  enableSearch = true

  [params.homepage]
    layout = "profile"
    showRecent = true
    recentLimit = 12

  [params.article]
    relatedContentLimit = 6
    showRelatedContent = true
  showWordCount = false
    showDate = true
    showReadingTime = false
    showAuthor = false
    showHero = true
    heroStyle = "background"
    showSummary = true
    sharingLinks = ["facebook", "x-twitter", "threads"]

  [params.list]
  showWordCount = false
    showHero = true
    heroStyle = "background"
    showSummary = true
    groupByYear = false

  [params.taxonomy]
    showTermCount = true

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.7
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      strikethrough = false

[[menus.main]]
  name = "글 목록"
  pageRef = "posts"
  weight = 10

[[menus.main]]
  name = "카테고리"
  pageRef = "categories"
  weight = 20

[[menus.main]]
  name = "태그"
  pageRef = "tags"
  weight = 30

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "date"
    weight = 10
timeZone = "Asia/Seoul"
